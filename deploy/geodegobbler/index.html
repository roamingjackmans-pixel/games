    for (const c of run.critters) { if (c.asleep) continue; const d = G.CRITTER_BY_ID[c.id]; if (d && d.flags) Object.assign(f, d.flags); }
    return f;
  };
  E.isFaceRaw = (run, c) => c.enh !== 'stone' && (c.rank >= 11 && c.rank <= 13 || (run && E.flags(run).allFace));
  E.isFace = (ctx, c) => E.isFaceRaw(ctx.run, c);
  E.suitIsRaw = (run, c, s) => {
    if (c.enh === 'stone') return false;
    if (c.enh === 'wild') return true;
    if (c.suit === s) return true;
    if (run && E.flags(run).smearSuits) { const g = { A: 'w', R: 'w', E: 'c', S: 'c' }; return g[c.suit] === g[s]; }
    return false;
  };
  E.suitIs = (ctx, c, s) => E.suitIsRaw(ctx.run, c, s);
  E.cardSparkle = (c) => (c.enh === 'stone' ? 50 : (c.rank >= 14 ? 11 : c.rank >= 10 ? 10 : c.rank)) + (c.bonus || 0);
  E.cardName = (c) => (c.enh === 'stone' ? 'Pet Rock' : `${G.rankLabel(c.rank)} of ${G.SUITS[c.suit].name}`);

  E.makeDeck = (run, kind) => {
    const deck = [];
    for (const s of G.SUIT_KEYS) for (let r = 2; r <= 14; r++) {
      if (kind === 'noface' && r >= 11 && r <= 13) continue;
      deck.push({ uid: nextUid(run), rank: r, suit: s, enh: kind === 'wild' ? 'wild' : null, edition: null, sticker: null, bonus: 0 });
    }
    return deck;
  };
  E.addCard = (run, card, toHand) => {
    const c = { uid: nextUid(run), rank: card.rank, suit: card.suit, enh: card.enh || null, edition: card.edition || null, sticker: card.sticker || null, bonus: card.bonus || 0 };
    run.deck.push(c);
    if (toHand && run.phase === 'play') run.hand.push(c); else run.drawPile.push(c.uid);
    for (const cr of run.critters) { const d = G.CRITTER_BY_ID[cr.id]; d && d.onCardAdded && d.onCardAdded(run, cr, c); }
    run.stats.cardsAdded = (run.stats.cardsAdded || 0) + 1;
    return c;
  };
  E.destroyCard = (run, card) => {
    run.deck = run.deck.filter((c) => c.uid !== card.uid);
    run.hand = run.hand.filter((c) => c.uid !== card.uid);
    run.drawPile = run.drawPile.filter((u) => u !== card.uid);
    run.stats.cardsDestroyed = (run.stats.cardsDestroyed || 0) + 1;
    for (const cr of run.critters) { const d = G.CRITTER_BY_ID[cr.id]; d && d.onDestroy && d.onDestroy(run, cr, card); }
  };
  E.cardByUid = (run, uid) => run.deck.find((c) => c.uid === uid);

  /* ---------- critters & consumables ---------- */
  E.freeSlots = (run) => run.critterSlots - run.critters.filter((c) => c.edition !== 'fossil').length;
  E.addCritter = (run, id, edition) => {
    const d = G.CRITTER_BY_ID[id]; if (!d) return null;
    const c = { uid: nextUid(run), id, edition: edition || null, state: {}, grumpy: false };
    if (d.init) d.init(c, run);
    run.critters.push(c);
    run.seen[id] = 1;
    if (run.onCollect) run.onCollect(id, c.edition);
    for (const cr of run.critters) { const dd = G.CRITTER_BY_ID[cr.id]; if (cr !== c && dd.onCritterAdded) dd.onCritterAdded(run, cr, c); }
    return c;
  };
  E.removeCritter = (run, c) => { run.critters = run.critters.filter((x) => x !== c); };
  E.sellValue = (run, c) => Math.max(1, Math.floor(E.critterCost(run, c.id, c.edition) / 2) + (c.state.extraValue || 0));
  E.critterCost = (run, id, edition) => {
    const d = G.CRITTER_BY_ID[id];
    let cost = d.cost + ({ glittery: 2, holo: 3, molten: 5, fossil: 5 }[edition] || 0);
    return Math.max(1, Math.round(cost * (run.discount || 1)));
  };
  E.addConsumable = (run, kind, id, force) => {
    if (!force && run.consumables.length >= run.consumableSlots) return false;
    if (run.consumables.length >= run.consumableSlots + 1) return false;
    run.consumables.push({ uid: nextUid(run), kind, id });
    return true;
  };
  E.addGizmo = (run, id) => { if (run.gizmos.includes(id)) return; run.gizmos.push(id); G.GIZMO_BY_ID[id].apply(run); };

  /* weighted critter roll: rarity 1 common, 2 uncommon, 3 rare, 4 legendary (only when asked) */
  E.rollCritter = (run, forceRarity, exclude) => {
    let rarity = forceRarity;
    if (!rarity) rarity = G.pickW(run.rng, [[1, 70], [2, 25], [3, 5]]);
    const owned = new Set(run.critters.map((c) => c.id));
    const ex = new Set(exclude || []);
    let pool = G.CRITTERS.filter((d) => d.rarity === rarity && !owned.has(d.id) && !ex.has(d.id) && E.critterUnlocked(run, d));
    if (!pool.length) pool = G.CRITTERS.filter((d) => d.rarity <= 3 && !owned.has(d.id) && !ex.has(d.id) && E.critterUnlocked(run, d));
    if (!pool.length) return null;
    return pool[Math.floor(run.rng() * pool.length)];
  };
  E.critterUnlocked = (run, d) => !d.unlock || !run.isLocked || !run.isLocked(d);
  E.rollEdition = (run) => {
    const r = run.rng(), k = run.editionRate || 1;
    if (r < 0.003 * k) return 'fossil';
    if (r < 0.007 * k) return 'molten';
    if (r < 0.022 * k) return 'holo';
    if (r < 0.047 * k) return 'glittery';
    return null;
  };

  /* ---------- hand evaluation ---------- */
  E.evaluate = (run, cards) => {
    const f = E.flags(run);
    const need = f.fourFingers ? 4 : 5;
    const ranked = cards.filter((c) => c.enh !== 'stone');
    const counts = {};
    for (const c of ranked) (counts[c.rank] = counts[c.rank] || []).push(c);
    const groups = Object.values(counts).sort((a, b) => b.length - a.length || b[0].rank - a[0].rank);
    // flush
    let flushCards = null;
    for (const s of G.SUIT_KEYS) {
      const fc = ranked.filter((c) => E.suitIsRaw(run, c, s));
      if (fc.length >= need && (!flushCards || fc.length > flushCards.length)) flushCards = fc;
    }
    // straight
    let straightCards = null;
    if (ranked.length >= need) {
      const byRank = {};
      for (const c of ranked) { if (!byRank[c.rank]) byRank[c.rank] = c; }
      const ranks = Object.keys(byRank).map(Number);
      if (byRank[14]) ranks.push(1);
      const uniq = [...new Set(ranks)].sort((a, b) => a - b);
      const gap = f.shortcut ? 2 : 1;
      let best = [], cur = [];
      for (const r of uniq) {
        if (cur.length && r - cur[cur.length - 1] <= gap) cur.push(r); else cur = [r];
        if (cur.length > best.length) best = cur.slice();
      }
      if (best.length >= need) straightCards = best.map((r) => byRank[r === 1 ? 14 : r]);
    }
    const n0 = groups[0] ? groups[0].length : 0, n1 = groups[1] ? groups[1].length : 0;
    const contains = new Set(['High Crunch']);
    if (n0 >= 2) contains.add('Pair');
    if (n0 >= 2 && n1 >= 2) contains.add('Two Pair');
    if (n0 >= 3) contains.add('Three of a Kind');
    if (n0 >= 4) contains.add('Four of a Kind');
    if (n0 >= 5) contains.add('Five of a Kind');
    if (n0 >= 3 && n1 >= 2) contains.add('Full House');
    if (straightCards) contains.add('Straight');
    if (flushCards) contains.add('Flush');
    if (straightCards && flushCards) contains.add('Straight Flush');
    let type, scoring;
    if (n0 >= 5 && flushCards) { type = 'Flush Five'; scoring = groups[0]; }
    else if (n0 >= 3 && n1 >= 2 && flushCards && flushCards.length >= 5) { type = 'Flush House'; scoring = [...groups[0], ...groups[1]]; }
    else if (n0 >= 5) { type = 'Five of a Kind'; scoring = groups[0]; }
    else if (straightCards && flushCards) { type = 'Straight Flush'; scoring = [...new Set([...straightCards, ...flushCards])]; }
    else if (n0 >= 4) { type = 'Four of a Kind'; scoring = groups[0]; }
    else if (n0 >= 3 && n1 >= 2) { type = 'Full House'; scoring = [...groups[0], ...groups[1]]; }
    else if (flushCards) { type = 'Flush'; scoring = flushCards; }
    else if (straightCards) { type = 'Straight'; scoring = straightCards; }
    else if (n0 >= 3) { type = 'Three of a Kind'; scoring = groups[0]; }
    else if (n0 >= 2 && n1 >= 2) { type = 'Two Pair'; scoring = [...groups[0], ...groups[1]]; }
    else if (n0 >= 2) { type = 'Pair'; scoring = groups[0]; }
    else if (ranked.length) { type = 'High Crunch'; scoring = [ranked.slice().sort((a, b) => b.rank - a.rank)[0]]; }
    else { type = 'High Crunch'; scoring = []; }
    if (type.startsWith('Flush') || type === 'Full House' || type === 'Five of a Kind') contains.add(type);
    contains.add(type);
    // pet rocks always score; splash makes every card score
    const set = new Set(scoring.map((c) => c.uid));
    for (const c of cards) if (c.enh === 'stone' || f.splash) set.add(c.uid);
    scoring = cards.filter((c) => set.has(c.uid)); // keep played (left to right) order
    return { type, scoring, contains };
  };

  E.handLevel = (run, type) => run.levels[type] || 1;
  E.handBase = (run, type) => {
    const h = G.HAND_BY_ID[type];
    const boss = E.boss(run);
    const lvl = boss && boss.level1 ? 1 : E.handLevel(run, type);
    let s = h.s + h.ls * (lvl - 1), m = h.m + h.lm * (lvl - 1);
    if (boss && boss.halfBase) { s = Math.max(1, Math.floor(s / 2)); m = Math.max(1, Math.floor(m / 2)); }
    return { sparkle: s, shine: m, level: lvl };
  };
  E.boss = (run) => (run.blindIdx === 2 && run.phase === 'play' && !run.bossDisabled ? G.BOSS_BY_ID[run.bosses[run.ante]] || null : null);
  /* cure the current Indigestion mid-round (Medicine Show Alpaca): undo what it did at the start of the blind */
  E.cureBoss = (run) => {
    const boss = E.boss(run); if (!boss) return false;
    run.bossDisabled = true;
    if (boss.handSize) run.curHandSize -= boss.handSize;
    if (boss.shrink) run.curHandSize = run.handSize;
    if (boss.discards != null) run.discards += Math.max(0, run.maxDiscards - boss.discards);
    run.hand.forEach((c) => (c.faceDown = false));
    run.critters.forEach((c) => (c.asleep = false));
    E.draw(run);
    return true;
  };

  /* ---------- scoring ---------- */
  E.scoreHand = (run, selected, opts = {}) => {
    const ev = E.evaluate(run, selected);
    const boss = E.boss(run);
    const base = E.handBase(run, ev.type);
    const events = [];
    let sparkle = base.sparkle, shine = base.shine, money = 0;
    const scoredSet = new Set(ev.scoring.map((c) => c.uid));
    const held = run.hand.filter((c) => !selected.includes(c));
    const ctx = {
      run, type: ev.type, contains: ev.contains, played: selected, scoring: ev.scoring, held,
      handsLeft: run.hands, discardsLeft: run.discards, preview: !!opts.preview,
      rng: opts.preview ? (() => 0.999) : run.rng,
      get money() { return run.money + money; },
      get sparkle() { return sparkle; }, get shine() { return shine; },
      critters: run.critters, events,
      timesPlayed: (run.handPlays[ev.type] || 0) + (opts.preview ? 1 : 0),
    };
    events.push({ kind: 'base', type: ev.type, level: base.level, sparkle, shine });
    let zero = false;
    if (boss) {
      if (boss.must5 && selected.length !== 5) zero = true;
      if (boss.onceEach && run.roundTypes && run.roundTypes[ev.type]) zero = true;
      if (boss.firstZero && run.hands === run.maxHandsThisRound) zero = true;
      if (boss.mostPlayed) { const mp = E.mostPlayed(run); if (mp && mp === ev.type) zero = true; }
      if (zero) { events.push({ kind: 'boss', msg: 'NOT ALLOWED!' }); return { type: ev.type, scoring: ev.scoring, contains: ev.contains, events, sparkle: 0, shine: 0, total: 0, money: 0, zero: true, level: base.level }; }
    }
    const debuffed = (c) => !!(c.debuff || (boss && boss.debuff && boss.debuff(c, run)) || (boss && boss.ulcer && c.suit === run.ulcerSuit && c.enh !== 'stone' && c.enh !== 'wild'));
    const active = run.critters.filter((c) => !c.asleep);
    const apply = (eff, src) => {
      if (!eff) return;
      const list = Array.isArray(eff) ? eff : [eff];
      for (const e of list) {
        if (!e) continue;
        const rec = { ...src };
        if (e.sparkle) { sparkle += e.sparkle; rec.sparkle = e.sparkle; }
        if (e.shine) { shine += e.shine; rec.shine = e.shine; }
        if (e.xshine && e.xshine !== 1) { shine *= e.xshine; rec.xshine = e.xshine; }
        if (e.money) { money += e.money; rec.money = e.money; }
        if (e.msg) rec.msg = e.msg;
        rec.sparkleNow = sparkle; rec.shineNow = shine;
        if (rec.sparkle || rec.shine || rec.xshine || rec.money || rec.msg) events.push(rec);
      }
    };
    const critterDef = (c) => G.CRITTER_BY_ID[c.id];
    // before
    for (const c of active) { const d = critterDef(c); if (d.before) apply(d.before(ctx, c), { kind: 'critter', uid: c.uid }); }
    if (ctx.levelChanged) { const b2 = E.handBase(run, ev.type); sparkle += b2.sparkle - base.sparkle; shine += b2.shine - base.shine; events.push({ kind: 'base', type: ev.type, level: b2.level, sparkle, shine, levelUp: true }); }
    // scoring cards
    const shattered = [];
    for (const card of selected) {
      if (!scoredSet.has(card.uid)) continue;
      if (debuffed(card)) { events.push({ kind: 'card', uid: card.uid, msg: 'Debuffed!', debuff: true }); continue; }
      let triggers = 1 + (card.sticker === 'red' ? 1 : 0);
      for (const c of active) { const d = critterDef(c); if (d.retrigger) { const n = d.retrigger(ctx, c, card) || 0; if (n) { triggers += n; events.push({ kind: 'critter', uid: c.uid, msg: 'Again!' }); } } }
      for (let t = 0; t < triggers; t++) {
        const src = { kind: 'card', uid: card.uid, retrig: t > 0 };
        apply({ sparkle: E.cardSparkle(card) }, src);
        if (card.enh === 'crystal') apply({ sparkle: 35 }, src);
        if (card.enh === 'glow') apply({ shine: 4 }, src);
        if (card.enh === 'brittle') apply({ xshine: 2 }, src);
        if (card.enh === 'lucky') {
          if (ctx.rng() < 0.2 * (ctx.luck || 1)) { apply({ shine: 20, msg: 'Lucky!' }, src); ctx.luckyHits = (ctx.luckyHits || 0) + 1; }
          if (ctx.rng() < (1 / 15) * (ctx.luck || 1)) { apply({ money: 20, msg: 'JACKPOT!' }, src); ctx.luckyHits = (ctx.luckyHits || 0) + 1; }
        }
        if (card.edition === 'glittery') apply({ sparkle: 40 }, src);
        if (card.edition === 'holo') apply({ shine: 8 }, src);
        if (card.edition === 'molten') apply({ xshine: 1.5 }, src);
        if (card.sticker === 'gold') apply({ money: 3 }, src);
        for (const c of active) { const d = critterDef(c); if (d.onScore) apply(d.onScore(ctx, c, card), { kind: 'critter', uid: c.uid, card: card.uid }); }
      }
      if (card.enh === 'brittle' && !opts.preview && ctx.rng() < 0.25) shattered.push(card);
    }
    // held cards
    for (const card of held) {
      if (debuffed(card)) continue;
      let triggers = 1 + (card.sticker === 'red' ? 1 : 0);
      for (const c of active) { const d = critterDef(c); if (d.retriggerHeld) triggers += d.retriggerHeld(ctx, c, card) || 0; }
      for (let t = 0; t < triggers; t++) {
        const src = { kind: 'held', uid: card.uid };
        if (card.enh === 'iron') apply({ xshine: 1.5 }, src);
        for (const c of active) { const d = critterDef(c); if (d.onHeld) apply(d.onHeld(ctx, c, card), { kind: 'critter', uid: c.uid, card: card.uid }); }
      }
    }
    // critters
    for (const c of active) {
      const d = critterDef(c), src = { kind: 'critter', uid: c.uid };
      if (c.edition === 'glittery') apply({ sparkle: 40 }, src);
      if (c.edition === 'holo') apply({ shine: 8 }, src);
      if (d.onHand) apply(d.onHand(ctx, c), src);
      for (const o of active) { const od = critterDef(o); if (o !== c && od.onOtherCritter) apply(od.onOtherCritter(ctx, o, c), { kind: 'critter', uid: o.uid }); }
      if (c.edition === 'molten') apply({ xshine: 1.5 }, src);
    }
    if (ctx.copyHand) for (const pair of ctx.copyHand) apply(pair.eff, { kind: 'critter', uid: pair.uid });
    let total = Math.floor(sparkle * shine);
    if (!isFinite(total)) total = Number.MAX_VALUE;
    return { type: ev.type, scoring: ev.scoring, contains: ev.contains, events, sparkle, shine, total, money, shattered, level: base.level, ctx };
  };
  E.mostPlayed = (run) => { let best = null, n = 0; for (const [k, v] of Object.entries(run.handPlays)) if (v > n) { n = v; best = k; } return best; };

  /* ---------- run lifecycle ---------- */
  E.newRun = (opts) => {
    const seed = opts.seed || ((Math.random() * 2 ** 31) | 0);
    const run = {
      v: 1, seed, rngState: seed, uidSeq: 1000, pouch: opts.pouch || 'burlap', spice: opts.spice || 1,
      ante: 1, blindIdx: 0, phase: 'select', round: 0,
      deck: [], drawPile: [], hand: [], hands: 0, discards: 0,
      maxHands: 4, maxDiscards: 3, handSize: 8, critterSlots: 5, consumableSlots: 2,
      money: 4, critters: [], consumables: [], gizmos: [], tags: [], pendingTags: [],
      levels: {}, handPlays: {}, roundTypes: {}, roundScore: 0, target: 0,
      shopSlots: 2, rerollDiscount: 0, interestCap: 5, interestStep: 5, tonicRate: 1, runeRate: 1, editionRate: 1, discount: 1, targetMult: 1,
      bosses: [], skipped: [], tagOffers: [], shop: null, seen: {}, stats: { hands: 0, bestHand: 0, money: 0, rerolls: 0, packs: 0, discards: 0 },
      lastConsumable: null, bestHandType: null, startedAt: Date.now(),
    };
    E.attachRng(run);
    const meta = opts.meta || {};
    run.money += meta.startMoney || 0;
    run.maxHands += meta.hands || 0;
    run.maxDiscards += meta.discards || 0;
    run.handSize += meta.handSize || 0;
    run.critterSlots += meta.critterSlots || 0;
    run.consumableSlots += meta.consumableSlots || 0;
    run.interestCap += meta.interestCap || 0;
    run.rerollDiscount += meta.rerollDiscount || 0;
    run.editionRate *= meta.editionRate || 1;
    const p = G.POUCH_BY_ID[run.pouch];
    run.deck = E.makeDeck(run, p.deck);
    if (p.setup) p.setup(run);
    if (run.spice >= 4) run.maxDiscards -= 1;
    if (run.spice >= 7) run.maxHands -= 1;
    run.maxHands = Math.max(1, run.maxHands); run.maxDiscards = Math.max(0, run.maxDiscards);
    E.rollBossesFor(run, 1);
    E.rollTagOffers(run);
    return run;
  };
  E.attachRng = (run) => {
    const r = G.mkRng(run.rngState);
    run.rng = () => { const v = r(); run.rngState = r.state(); return v; };
    Object.defineProperty(run, 'rng', { enumerable: false });
  };
  E.rollBossesFor = (run, ante) => {
    if (run.bosses[ante]) return;
    const recent = new Set(run.bosses.slice(-3));
    let pool;
    if (ante % 8 === 0) pool = G.FINAL_BOSSES;
    else pool = G.BOSSES.filter((b) => (b.minAnte || 1) <= ante && !recent.has(b.id));
    run.bosses[ante] = pool[Math.floor(run.rng() * pool.length)].id;
  };
  E.rollTagOffers = (run) => { run.tagOffers = [0, 1].map(() => G.TAGS[Math.floor(run.rng() * G.TAGS.length)].id); };
  E.blindName = (i) => ['Snack', 'Meal', 'Indigestion'][i];
  E.blindTarget = (run, i = run.blindIdx, ante = run.ante) => {
    const base = G.anteBase(ante, run.spice) * run.targetMult;
    let mult = [1, 1.5, 2][i];
    if (i === 2) { const b = G.BOSS_BY_ID[run.bosses[ante]]; if (b && b.mult) mult = b.mult; }
    if (run.spice >= 3 && i > 0) mult *= 1.1;
    const v = base * mult;
    const p = Math.pow(10, Math.max(1, Math.floor(Math.log10(v)) - 2));
    return Math.round(v / p) * p;
  };
  E.blindReward = (run, i = run.blindIdx) => (run.spice >= 2 && i === 0 ? 0 : [3, 4, 5][i]);

  E.skipBlind = (run) => {
    if (run.blindIdx >= 2) return null;
    const tagId = run.tagOffers[run.blindIdx];
    run.skipped.push(run.ante * 10 + run.blindIdx);
    E.gainTag(run, tagId);
    run.blindIdx++;
    run.stats.skips = (run.stats.skips || 0) + 1;
    for (const c of run.critters) { const d = G.CRITTER_BY_ID[c.id]; d.onSkip && d.onSkip(run, c); }
    return tagId;
  };
  E.gainTag = (run, tagId) => {
    const t = G.TAG_BY_ID[tagId];
    if (tagId === 'tag_double') { run.tags.push(tagId); return; }
    const copies = 1 + run.tags.filter((x) => x === 'tag_double').length;
    run.tags = run.tags.filter((x) => x !== 'tag_double');
    for (let i = 0; i < copies; i++) { if (t.now) t.now(run); else run.tags.push(tagId); }
  };

  E.startBlind = (run) => {
    run.phase = 'play';
    run.round++;
    run.roundScore = 0;
    run.roundTypes = {};
    run.bossDisabled = false;
    run.target = E.blindTarget(run);
    run.hands = run.maxHands;
    run.discards = run.maxDiscards;
    run.curHandSize = run.handSize;
    if (run.tags.includes('tag_juggle')) { run.curHandSize += 3; run.tags.splice(run.tags.indexOf('tag_juggle'), 1); }
    const boss = E.boss(run);
    if (boss) {
      if (boss.handSize) run.curHandSize += boss.handSize;
      if (boss.discards != null) run.discards = Math.min(run.discards, boss.discards);
      if (boss.ulcer) { const cnt = {}; run.deck.forEach((c) => (cnt[c.suit] = (cnt[c.suit] || 0) + 1)); run.ulcerSuit = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0]; }
    }
    run.maxHandsThisRound = run.hands;
    run.hand = [];
    run.drawPile = G.shuffle(run.deck.map((c) => c.uid), run.rng);
    for (const c of run.critters) { c.asleep = false; const d = G.CRITTER_BY_ID[c.id]; d.onBlindStart && d.onBlindStart(run, c); }
    if (boss && boss.voidSleep) run.critters.forEach((c) => (c.asleep = true));
    E.draw(run);
    run.handsPlayedThisRound = 0;
  };
  E.draw = (run) => {
    const boss = E.boss(run);
    const drawn = [];
    while (run.hand.length < run.curHandSize && run.drawPile.length) {
      const c = E.cardByUid(run, run.drawPile.pop());
      if (!c) continue;
      c.faceDown = !!(boss && boss.faceDown && run.rng() < boss.faceDown);
      run.hand.push(c); drawn.push(c);
    }
    E.sortHand(run);
    return drawn;
  };
  E.sortHand = (run) => {
    const key = run.sortBy === 'suit' ? (c) => (c.enh === 'stone' ? 9 : G.SUIT_KEYS.indexOf(c.suit)) * 100 + (20 - c.rank) : (c) => (c.enh === 'stone' ? -1 : c.rank) * -10 + G.SUIT_KEYS.indexOf(c.suit);
    run.hand.sort((a, b) => key(a) - key(b));
  };

  E.canPlay = (run, uids) => {
    if (run.phase !== 'play' || run.hands <= 0 || !uids.length || uids.length > 5) return false;
    const boss = E.boss(run);
    if (boss && boss.max3 && uids.length > 3) return false;
    return true;
  };
  E.play = (run, uids) => {
    if (!E.canPlay(run, uids)) return null;
    const selected = uids.map((u) => run.hand.find((c) => c.uid === u)).filter(Boolean);
    selected.forEach((c) => (c.faceDown = false));
    const boss = E.boss(run);
    // nap: one critter sleeps for this hand
    if (boss && boss.napper && run.critters.length) { run.critters.forEach((c) => (c.asleep = false)); run.critters[Math.floor(run.rng() * run.critters.length)].asleep = true; }
    const res = E.scoreHand(run, selected);
    run.hands--;
    run.handsPlayedThisRound++;
    run.handPlays[res.type] = (run.handPlays[res.type] || 0) + 1;
    run.roundTypes[res.type] = 1;
    run.roundScore += res.total;
    run.money += res.money;
    if (boss && boss.grumble) run.money -= selected.length;
    run.stats.hands++;
    run.stats.money += Math.max(0, res.money);
    if (res.total > run.stats.bestHand) { run.stats.bestHand = res.total; run.bestHandType = res.type; }
    for (const c of run.critters) { const d = G.CRITTER_BY_ID[c.id]; d.afterPlay && d.afterPlay(run, c, res); }
    // remove played cards from hand
    run.hand = run.hand.filter((c) => !selected.includes(c));
    for (const c of res.shattered || []) E.destroyCard(run, c);
    if (boss && boss.voidSleep && run.handsPlayedThisRound >= 1) run.critters.forEach((c) => (c.asleep = false));
    if (boss && boss.napper) {/* sleeper wakes next hand */}
    res.won = run.roundScore >= run.target;
    if (!res.won) {
      if (boss && boss.hiccup) for (let i = 0; i < boss.hiccup && run.hand.length; i++) run.hand.splice(Math.floor(run.rng() * run.hand.length), 1);
      if (boss && boss.shrink) run.curHandSize = Math.max(1, run.curHandSize - 1);
      if (run.hands > 0) res.drawn = E.draw(run);
      else res.lost = true;
    }
    return res;
  };
  E.discard = (run, uids) => {
    if (run.phase !== 'play' || run.discards <= 0 || !uids.length || uids.length > 5) return null;
    const cards = uids.map((u) => run.hand.find((c) => c.uid === u)).filter(Boolean);
    const out = { events: [] };
    for (const c of run.critters) { const d = G.CRITTER_BY_ID[c.id]; if (d.onDiscard) { const e = d.onDiscard({ run, rng: run.rng }, c, cards); if (e) out.events.push({ uid: c.uid, ...e }); if (e && e.money) run.money += e.money; } }
    for (const c of cards) if (c.sticker === 'purple') { if (E.addConsumable(run, 'rune', G.RUNES[Math.floor(run.rng() * G.RUNES.length)].id)) out.events.push({ card: c.uid, msg: '+Rune' }); }
    run.hand = run.hand.filter((c) => !cards.includes(c));
    run.discards--;
    run.stats.discards++;
    out.drawn = E.draw(run);
    return out;
  };

  /* after a won craving: money breakdown, then shop */
  E.cashOut = (run) => {
    const lines = [];
    const blindPay = E.blindReward(run);
    if (blindPay) lines.push({ label: `${E.blindName(run.blindIdx)} eaten`, money: blindPay });
    if (!run.noHandMoney && run.hands > 0) lines.push({ label: `${run.hands} unused hand${run.hands > 1 ? 's' : ''}`, money: run.hands });
    // golden cards held
    const gold = run.hand.filter((c) => c.enh === 'golden').length;
    if (gold) lines.push({ label: `${gold} Golden card${gold > 1 ? 's' : ''} held`, money: gold * 3 });
    for (const c of run.critters) {
      const d = G.CRITTER_BY_ID[c.id];
      if (d.onRoundEnd) { const r = d.onRoundEnd(run, c); if (r && r.money) lines.push({ label: d.name, money: r.money, critter: c.uid }); }
      if (c.grumpy) lines.push({ label: `${d.name} is grumpy`, money: -1 });
    }
    if (run.blindIdx === 2 && run.tags.includes('tag_invest')) { run.tags = run.tags.filter((t) => t !== 'tag_invest'); lines.push({ label: 'Investment Tag', money: 20 }); }
    const preInterest = run.money + lines.reduce((a, l) => a + l.money, 0);
    const interest = Math.min(run.interestCap, Math.floor(Math.max(0, preInterest) / run.interestStep));
    if (interest > 0) lines.push({ label: `Interest ($1 per $${run.interestStep}, max $${run.interestCap})`, money: interest });
    const total = lines.reduce((a, l) => a + l.money, 0);
    run.money += total;
    run.stats.money += Math.max(0, total);
    // leftover cards back into the deck
    run.hand.forEach((c) => (c.faceDown = false));
    run.hand = [];
    const wasBoss = run.blindIdx === 2;
    const beatAnte = run.ante;
    if (wasBoss) {
      run.critters.forEach((c) => (c.asleep = false));
      if (run.ante === 8 && !run.endless) run.phase = 'won';
    }
    if (run.phase !== 'won') E.enterShop(run);
    return { lines, total, wasBoss, ante: beatAnte };
  };
  E.advance = (run) => {
    // called when leaving the shop
    if (run.blindIdx === 2) { run.ante++; run.blindIdx = 0; E.rollBossesFor(run, run.ante); E.rollTagOffers(run); run.gizmoOffer = null; }
    else run.blindIdx++;
    run.phase = 'select';
    run.shop = null;
  };
  E.continueEndless = (run) => { run.endless = true; E.enterShop(run); };

  /* ---------- shop ---------- */
  E.shopItem = (run) => {
    const t = G.pickW(run.rng, [['critter', 20], ['tonic', 4 * run.tonicRate], ['rune', 4 * run.runeRate]]);
    if (t === 'critter') {
      const d = E.rollCritter(run, null, run.shopSeen);
      if (!d) return E.shopItem(run);
      (run.shopSeen = run.shopSeen || []).push(d.id);
      run.seen[d.id] = 1;
      const edition = E.rollEdition(run);
      const grumpy = run.spice >= 6 && run.rng() < 0.3;
      return { kind: 'critter', id: d.id, edition, grumpy, cost: E.critterCost(run, d.id, edition) };
    }
    if (t === 'tonic') { const pool = G.TONICS.filter((x) => !x.secret || run.handPlays[x.hand]); const x = pool[Math.floor(run.rng() * pool.length)]; return { kind: 'tonic', id: x.id, cost: Math.round(3 * run.discount) }; }
    const x = G.RUNES[Math.floor(run.rng() * G.RUNES.length)];
    return { kind: 'rune', id: x.id, cost: Math.round(3 * run.discount) };
  };
  E.packCost = (run, type) => Math.round(G.PACKS[type].cost * run.discount);
  E.enterShop = (run) => {
    run.phase = 'shop';
    run.shopSeen = run.critters.map((c) => c.id);
    const items = [];
    for (let i = 0; i < run.shopSlots; i++) items.push(E.shopItem(run));
    const packTypes = () => G.pickW(run.rng, [['rune', 20], ['tonic', 20], ['critter', 12], ['card', 14], ['mega_rune', 4], ['mega_tonic', 4], ['mega_critter', 3], ['mystic', 4]]);
    const packs = [0, 1].map(() => { const t = packTypes(); return { type: t, cost: E.packCost(run, t) }; });
    // tags
    const take = (id) => { const i = run.tags.indexOf(id); if (i >= 0) { run.tags.splice(i, 1); return true; } return false; };
    while (take('tag_critter')) packs.unshift({ type: 'critter', cost: 0, free: true });
    while (take('tag_tonic')) packs.unshift({ type: 'mega_tonic', cost: 0, free: true });
    while (take('tag_mystic')) packs.unshift({ type: 'mystic', cost: 0, free: true });
    while (take('tag_rare')) { const d = E.rollCritter(run, 3); if (d) items.unshift({ kind: 'critter', id: d.id, edition: null, cost: 0, free: true }); }
    while (take('tag_holo')) { const d = E.rollCritter(run, null); if (d) items.unshift({ kind: 'critter', id: d.id, edition: 'holo', cost: 0, free: true }); }
    if (!run.gizmoOffer && run.gizmoOffer !== false) {
      const pool = G.GIZMOS.filter((g) => !run.gizmos.includes(g.id));
      run.gizmoOffer = pool.length ? pool[Math.floor(run.rng() * pool.length)].id : false;
    }
    run.shop = { items, packs, rerolls: 0, freeRerollUsed: false };
    for (const c of run.critters) { const d = G.CRITTER_BY_ID[c.id]; d.onShop && d.onShop(run, c); }
  };
  E.rerollCost = (run) => {
    if (run.freeReroll && !run.shop.freeRerollUsed) return 0;
    if (run.shop.freeRerolls) return 0;
    return Math.max(0, 5 + run.shop.rerolls - run.rerollDiscount);
  };
  E.reroll = (run) => {
    const cost = E.rerollCost(run);
    if (run.money < cost) return false;
    run.money -= cost;
    if (run.freeReroll && !run.shop.freeRerollUsed) run.shop.freeRerollUsed = true;
    else if (run.shop.freeRerolls) run.shop.freeRerolls--;
    else run.shop.rerolls++;
    run.stats.rerolls++;
    const n = run.shopSlots;
    run.shop.items = [];
    for (let i = 0; i < n; i++) run.shop.items.push(E.shopItem(run));
    for (const c of run.critters) { const d = G.CRITTER_BY_ID[c.id]; d.onReroll && d.onReroll(run, c); }
    return true;
  };
  E.buy = (run, idx) => {
    const it = run.shop.items[idx];
    if (!it || it.sold || run.money < it.cost) return { ok: false, why: 'Not enough money' };
    if (it.kind === 'critter') {
      if (E.freeSlots(run) <= 0 && it.edition !== 'fossil') return { ok: false, why: 'No room in your belly' };
      run.money -= it.cost;
      const c = E.addCritter(run, it.id, it.edition);
      c.grumpy = !!it.grumpy;
      it.sold = true;
      return { ok: true, critter: c };
    }
    if (run.consumables.length >= run.consumableSlots) return { ok: false, why: 'Lunch pail is full' };
    run.money -= it.cost;
    E.addConsumable(run, it.kind, it.id);
    it.sold = true;
    return { ok: true };
  };
  E.buyGizmo = (run) => {
    const id = run.gizmoOffer; if (!id) return false;
    const cost = Math.round(10 * run.discount);
    if (run.money < cost) return false;
    run.money -= cost; E.addGizmo(run, id); run.gizmoOffer = false; return true;
  };
  E.sell = (run, critter) => {
    const d = G.CRITTER_BY_ID[critter.id];
    const v = E.sellValue(run, critter);
    run.money += v;
    if (d.onSell) d.onSell(run, critter);
    E.removeCritter(run, critter);
    for (const c of run.critters) { const dd = G.CRITTER_BY_ID[c.id]; dd.onAnySell && dd.onAnySell(run, c, critter); }
    return v;
  };
  E.sellConsumable = (run, cons) => { run.consumables = run.consumables.filter((x) => x !== cons); run.money += 1; };

  /* packs: open returns choices; choose applies */
  E.openPack = (run, idx) => {
    const p = run.shop.packs[idx];
    if (!p || p.sold || run.money < p.cost) return null;
    run.money -= p.cost; p.sold = true;
    run.stats.packs++;
    const def = G.PACKS[p.type];
    const base = def.base || p.type;
    const choices = [];
    const seen = new Set();
    for (let i = 0; i < def.show; i++) {
      if (base === 'rune') { const x = G.RUNES[Math.floor(run.rng() * G.RUNES.length)]; choices.push({ kind: 'rune', id: x.id }); }
      else if (base === 'tonic') { const pool = G.TONICS.filter((x) => (!x.secret || run.handPlays[x.hand]) && !seen.has(x.id)); const x = pool[Math.floor(run.rng() * pool.length)]; seen.add(x.id); choices.push({ kind: 'tonic', id: x.id }); }
      else if (base === 'critter') { const d = E.rollCritter(run, null, [...seen]); if (d) { seen.add(d.id); run.seen[d.id] = 1; choices.push({ kind: 'critter', id: d.id, edition: E.rollEdition(run) }); } }
      else if (base === 'mystic') { const pool = G.MYSTIC.filter((x) => !seen.has(x.id)); const x = pool[Math.floor(run.rng() * pool.length)]; seen.add(x.id); choices.push({ kind: 'mystic', id: x.id }); }
      else if (base === 'card') {
        const card = { rank: 2 + Math.floor(run.rng() * 13), suit: G.SUIT_KEYS[Math.floor(run.rng() * 4)], enh: null, edition: null, sticker: null };
        const r = run.rng();
        if (r < 0.4) card.enh = ['crystal', 'glow', 'brittle', 'iron', 'golden', 'lucky', 'stone', 'wild'][Math.floor(run.rng() * 8)];
        if (run.rng() < 0.08) card.edition = ['glittery', 'holo', 'molten'][Math.floor(run.rng() * 3)];
        if (run.rng() < 0.05) card.sticker = ['red', 'gold', 'purple'][Math.floor(run.rng() * 3)];
        choices.push({ kind: 'card', card });
      }
    }
    run.pack = { type: p.type, choices, picks: def.pick, needsHand: base === 'rune' || base === 'mystic' };
    if (run.pack.needsHand) {
      // deal a temporary hand so runes can target cards
      run.hand = []; run.drawPile = G.shuffle(run.deck.map((c) => c.uid), run.rng); run.curHandSize = run.handSize;
      while (run.hand.length < run.curHandSize && run.drawPile.length) run.hand.push(E.cardByUid(run, run.drawPile.pop()));
      E.sortHand(run);
    }
    return run.pack;
  };
  E.packChoose = (run, i, selectedUids = []) => {
    const pk = run.pack; if (!pk) return { ok: false };
    const ch = pk.choices[i]; if (!ch || ch.taken) return { ok: false };
    let msg = null;
    if (ch.kind === 'critter') {
      if (E.freeSlots(run) <= 0 && ch.edition !== 'fossil') return { ok: false, why: 'No room in your belly' };
      E.addCritter(run, ch.id, ch.edition);
    } else if (ch.kind === 'card') {
      E.addCard(run, ch.card);
    } else {
      const r = E.useConsumable(run, { kind: ch.kind, id: ch.id }, selectedUids, true);
      if (!r.ok) return r; msg = r.msg;
    }
    ch.taken = true;
    pk.picks--;
    if (pk.picks <= 0) E.closePack(run);
    return { ok: true, msg };
  };
  E.closePack = (run) => { if (run.pack && run.pack.needsHand) { run.hand = []; } run.pack = null; };

  E.useConsumable = (run, cons, selectedUids = [], fromPack) => {
    const def = G.CONSUMABLE[cons.id];
    if (!def) return { ok: false };
    const cards = selectedUids.map((u) => run.hand.find((c) => c.uid === u)).filter(Boolean);
    if (def.kind === 'tonic') {
      run.levels[def.hand] = (run.levels[def.hand] || 1) + 1;
      run.lastConsumable = { kind: 'tonic', id: def.id };
      if (!fromPack) run.consumables = run.consumables.filter((x) => x !== cons);
      run.stats.tonics = (run.stats.tonics || 0) + 1;
      for (const c of run.critters) { const d = G.CRITTER_BY_ID[c.id]; d.onTonic && d.onTonic(run, c, def); }
      return { ok: true, msg: `${def.hand} → level ${run.levels[def.hand]}`, levelUp: def.hand };
    }
    if (def.needsHand && !run.hand.length) return { ok: false, why: 'Needs cards in hand' };
    if (def.n > 0) {
      if (!cards.length) return { ok: false, why: `Select ${def.exact ? '' : 'up to '}${def.n} card${def.n > 1 ? 's' : ''} first` };
      if (cards.length > def.n) return { ok: false, why: `Select at most ${def.n}` };
      if (def.exact && cards.length !== def.n) return { ok: false, why: `Select exactly ${def.n}` };
    }
    if (def.canUse && !def.canUse(run)) return { ok: false, why: "Can't use that right now" };
    // keep play order for echo: left = first in hand order
    cards.sort((a, b) => run.hand.indexOf(a) - run.hand.indexOf(b));
    const msg = def.use(run, cards);
    if (def.id !== 'r_copy') run.lastConsumable = { kind: def.kind === 'mystic' ? 'mystic' : 'rune', id: def.id };
    if (!fromPack) run.consumables = run.consumables.filter((x) => x !== cons);
    run.stats.runes = (run.stats.runes || 0) + 1;
    for (const c of run.critters) { const d = G.CRITTER_BY_ID[c.id]; d.onRune && d.onRune(run, c, def); }
    E.sortHand(run);
    return { ok: true, msg };
  };

  /* serialize (rng is re-attached on load) */
  E.save = (run) => JSON.parse(JSON.stringify(run));
  E.load = (data) => { const run = data; E.attachRng(run); return run; };
  return E;
})();

  T.play = async () => {

    await wait(320);
    // base
    const base = res.events[0];
    el.htype.innerHTML = `<b>${res.type}</b> <i>lvl ${res.level}</i>`;

    let step = 0, delay = 420;
    for (const ev of res.events.slice(1)) {
      if (ev.kind === 'base') { el.htype.innerHTML = `<b>${res.type}</b> <i>lvl ${ev.level}</i> ⬆️`; el.sp.textContent = G.fmt(ev.sparkle); el.sh.textContent = G.fmt(ev.shine); G.FX.bump(el.htype); G.Audio.upgrade(); await wait(delay); continue; }
      let target = null;

      const cls = ev.debuff ? 'dbf' : ev.xshine ? 'xsh' : ev.shine ? 'sh' : ev.sparkle ? 'sp' : ev.money ? 'mo' : 'msg';
      popLabel(p.x, p.y - (ev.kind === 'held' ? 40 : 70), label, cls, ev.msg && (ev.sparkle || ev.shine || ev.xshine || ev.money) ? ev.msg : null);
      if (ev.sparkleNow != null) { el.sp.textContent = G.fmt(ev.sparkleNow); el.sh.textContent = G.fmt(ev.shineNow); }
      if (ev.sparkle) { G.FX.bump(el.sp); G.Audio.chime(step, 'sparkle'); }
      else if (ev.xshine) { G.FX.bump(el.sh, 'bigbump'); G.Audio.chime(step, 'xshine'); G.FX.shake(3 + Math.min(8, ev.xshine)); G.FX.sparkles(p.x, p.y, 10, '#ff4f6d', 30); }

    const ratio = res.total / Math.max(1, r.target);

    G.FX.bump(el.htype, 'bigbump');
    const fire = ratio >= 1 ? 3 : ratio >= 0.5 ? 2 : ratio >= 0.25 ? 1 : 0;

    if (res.total >= 1e5 && res.total === S().bestHand) G.Gobbo.say(G.pick(G.QUIPS.bigHand), 2500);
    await countUp(el.rscore, before, r.roundScore, 650);

    { t: "Sports: Rodeo forfeits after all bulls are revealed to be boulders in horn hats. Bulls unbothered." },
    { t: "Survey: 9 out of 10 frontier dentists recommend not doing whatever the Sheriff is doing." },
    { t: "Ad: Gobble Insurance. Because your porch could be next, partner." },
    { t: "Notice: Our printing press was partly eaten. We apologize to readers of the Gravel G lch Gaz tte." },
    { t: "Rumor: The Sheriff can smell a geode three miles off. Rumor confirmed by Sheriff, sniffin' the wind." },
    { t: "Philosophy Corner: If a rock tumbles in the desert and nobody eats it, was it ever crunch?" },
    { t: "Classifieds: Seeking bunkmate. Must not eat walls. Third time postin' this. Still mean it." },
    { t: "Kids' Corner: Today's word is 'igneous.' It means 'spicy rock.' (It does not. Yeehaw anyway.)" },
    { t: "Traffic: Stagecoach delays on the Old Trail due to the trail being 'a bit chewed.'" },
    { t: "Horoscope (Leo): A shiny nugget will float past you. Lasso it. Unless it's cursed. Good luck tellin'." },
    { t: "Letter: 'My boy wants to be a rock-eatin' sheriff when he grows up. How do I support this?' - Proud(?)" },
    { t: "Local vulture gives up peckin' at gravel. Says it 'just can't compete with the Sheriff anymore.'" },
    { t: "Ad: Chew-Proof Spittoons! Guaranteed for up to one (1) afternoon." },
    { t: "Narrator: Folks, the mountains in the background are a painted backdrop. Sheriff, put down the backdrop." },
    { t: "Goblin in a bandana seen 'helpin' himself' around town. The Pebble Bandit strikes again!" },
    { t: "The Pebble Bandit, interviewed mid-gallop: 'It ain't rustlin' if it's a hobby!'" },
    { t: "Breaking: Sheriff Gobbo has eaten again. Updates when he stops. (He will not stop. Yeehaw.)" },
    { t: "WANTED: Whoever keeps eatin' the WANTED posters. Reward: one (1) poster, if any survive." },
    { t: "Rootin' tootin' news! A tumbleweed rolled through town. Then rolled back. It's on a fishing line." },
    { t: "Narrator: The horses are rocks wearing saddles. Always have been. Please stop feeding them hay." },
    { t: "Chuckwagon serves beans again. Sheriff Gobbo eats the chuckwagon. Beans remain, confused." },
    { t: "Town sign updated: 'Gravel Gulch, Pop. 212.' Then '211.' A burp is heard. The sign is gone." },
    { t: "Showdown at high noon postponed. High noon moved to 12:15 so the lighting guy could eat lunch." },
    { t: "Sheriff Gobbo twirls mustache, tips hat, eats hat. Says 'Howdy.' Nobody is sure who to." },
    { t: "Ad: Ten-Gallon Hats! Now holding eleven gallons, thanks to bite marks lettin' out the extra." },
    { t: "Narrator: Please note the jail bars are painted on. The prisoners know. They're just polite." },
    { t: "Spittoon Appreciation Week begins. Nobody is sure if they're allowed to appreciate it out loud." },
    { t: "Tumbleweed shortage hits Gravel Gulch. Stagehands now rolling a hairbrush across the street instead." },
    { t: "Saloon piano player reports the piano is 'mostly hums now.' Keys were ivory-colored rocks." },
    { t: "Lasso champion ropes a boulder. Boulder thinks it's a hug. Both are happier now." },
    { t: "Breaking: Cardboard cactus eaten for the fourth time this week. Narrator 'losing patience, and props.'" },
    { t: "Interview with a boulder: 'I have sat in this canyon nine thousand years. I am nervous now, partner.'" },
    { t: "Mysterious crater found shaped exactly like a tiny, satisfied mustache." },
    { t: "Weather: Dust storm rollin' in. Visibility poor. Chewing audible. Spurs jinglin'." },
    { t: "Opinion: Rocks were here first. The Final Mouth has filed a counterclaim, in triplicate." },
    { t: "Saloon doors swing open. A cowboy walks in. He is a rock. The Sheriff licks his lips." },
    { t: "Horoscope (Capricorn): Climb a mesa. Bring a fork. And a canteen. Mostly the fork." },
    { t: "Town crier yells 'YEEHAW' for no reason at all. Town agrees it was the right call." },
    { t: "Toddler hands the Sheriff a rock. Sheriff weeps with gratitude. Toddler deputized on the spot." },
    { t: "Rock horse 'Thunderhoof' wins the derby by not moving. All other horses also rocks. Tie declared." },
    { t: "Narrator: The 'gold' in the gold mine is spray paint. Sheriff, that is why it tastes like a fence." },

    // ---------- crunchAll >= 1e3 ----------
    { t: "Pebble prices rise 3% on news of 'a mighty enthusiastic buyer with a badge.'", c: ca(1e3) },
    { t: "Sheriff's operation now bigger than a lemonade stand. Lemonade stand files a complaint at the jail.", c: ca(1e3) },
    { t: "Ad: CRUNCH ACCEPTED HERE! (Sign posted outside the general store, by the general store.)", c: ca(1e3) },
    { t: "Sheriff Gobbo reaches 'four-digit snackin'.' His mama would be proud. His mama is a boulder.", c: ca(1e3) },
    { t: "Weather: Scattered pebbles. Grab 'em before the Sheriff does.", c: ca(1e3) },
    { t: "Gazette launches weekly column: 'What Did the Sheriff Eat This Week?'", c: ca(1e3) },
    { t: "Report: The Gravel Gulch gravel pit is now just 'the Gulch pit.' Town may need a new name.", c: ca(1e3) },
    { t: "Horoscope (Virgo): Count your nuggets. Count 'em again. One's missin'. You know who.", c: ca(1e3) },
    { t: "Gravel Gulch declares the Sheriff a 'minor natural phenomenon,' like a breezy Tuesday or a coyote.", c: ca(1e3) },
    { t: "Narrator: The gold mine entrance was a painted door. The Sheriff ate the door. Now it's just a wall.", c: ca(1e3) },

    // ---------- crunchAll >= 1e6 ----------

    { t: "Prospectors hold a candlelight vigil for 'the mesa we used to have.'", c: ca(1e6) },
    { t: "Breaking: Sheriff Gobbo is a crunch millionaire. The bank is unsure how to respond. The bank is stone.", c: ca(1e6) },
    { t: "Ad: Invest in Gravel Futures! Past performance is currently being eaten.", c: ca(1e6) },
    { t: "Train robbers arrive to rob the train. Train already eaten. Robbers leave a polite note.", c: ca(1e6) },
    { t: "Bank vault door now made of jelly 'to discourage snackin'.' Bandits thrilled.", c: ca(1e6) },

    { t: "Geologist strike enters day four. Picket signs read 'ROCKS ARE FOR LOOKIN'.'", c: ca(1e6) },
    { t: "Weather: The wind whistles different now. Old-timers blame the missin' canyons.", c: ca(1e6) },
    { t: "Narrator: The canyon is now a painted canvas with a bite in it. Production is aware. Production is crying.", c: ca(1e6) },

    { t: "Panic at the Gravel Exchange as pebbles trade at 'just under emotional value.'", c: ca(1e9) },
    { t: "Mountain range officially renamed 'The Mountain Range, Formerly.' Yeehaw, says nobody.", c: ca(1e9) },

    { t: "Ad: Bite-Proof Ranch Houses! Now with 30% less ranch house!", c: ca(1e9) },

    { t: "Report: Continental drift upgraded to 'continental stampede' as landmasses flee the Sheriff.", c: ca(1e9) },
    { t: "Horoscope (Scorpio): Your rock-solid plans are about to become gravel-loose plans.", c: ca(1e9) },
    { t: "Narrator: For the record, the sky is a blue bedsheet. If the Sheriff eats it, we're filming in a garage.", c: ca(1e9) },

    // ---------- crunchAll >= 1e12 ----------

    { t: "Territorial governors convene an emergency Pebble Summit. Summit held on a cloud, for safety.", c: ca(1e12) },
    { t: "Tides described as 'confused' as the moon keeps losin' weight.", c: ca(1e12) },
    { t: "Ad: Moon Insurance. We cover all lunar incidents. (Not that one, partner.)", c: ca(1e12) },
    { t: "Trillion-crunch economy declared 'too big to chew.' Sheriff Gobbo respectfully disagrees.", c: ca(1e12) },
    { t: "Report: The planet is now officially 'pleasantly hollow.' Yodeling acoustics are excellent.", c: ca(1e12) },
    { t: "Weather: Gravity slightly lighter today. Rock horses report feeling 'friskier.'", c: ca(1e12) },
    { t: "Interview with the Moon: 'I would like to speak to the sheriff. Wait. No. Not him.'", c: ca(1e12) },
    { t: "Seismologists say most earthquakes these days are 'contented digestion.'", c: ca(1e12) },
    { t: "Letter: 'Where did Mount Spiffy go? I had a chuckwagon picnic planned.' - Hungry Wrangler", c: ca(1e12) },

    // ---------- crunchAll >= 1e15 ----------

    { t: "Asteroid belt tightened by two notches. Belt buckle confiscated as evidence.", c: ca(1e15) },
    { t: "Breaking: The ringed planet's rings reported missing. Sheriff seen using one as a lasso.", c: ca(1e15) },
    { t: "Ad: Interplanetary Gravel Delivery by Stagecoach. Serving the hungriest customer in the cosmos.", c: ca(1e15) },
    { t: "Astronomers publish paper titled 'Is It Eating Us?' Peer review: 'Yep.'", c: ca(1e15) },

    { t: "Star maps updated with a new region marked 'HERE BE THE SHERIFF.'", c: ca(1e15) },
    { t: "Weather: Meteor shower cancelled. Meteors lassoed mid-fall and eaten.", c: ca(1e15) },
    { t: "Quadrillion-crunch hoedown attended by every surviving planet. Turnout: low. Square dancing: weak.", c: ca(1e15) },
    { t: "Narrator: We're out of sets. The Sheriff ate the outer space backdrop too. It was glitter on felt.", c: ca(1e15) },

    // ---------- crunchAll >= 1e20 ----------

    { t: "New regulation: all nebulae must now be taste-tested by a sheriff before bein' named.", c: ca(1e20) },
    { t: "Ad: Star Shields! Keep your star safe from small round lawmen.", c: ca(1e20) },
    { t: "WANTED posters for the Sheriff taped to every star. Sheriff eats the stars. Posters drift sadly.", c: ca(1e20) },
    { t: "Alien civilization sends message: 'Please stop.' Message eaten, as it was carved on a rock.", c: ca(1e20) },
    { t: "Black holes, jealous of the Sheriff's appetite, form a posse.", c: ca(1e20) },
    { t: "Interview with a comet: 'I used to have a tail. Now I have a campfire story.'", c: ca(1e20) },
    { t: "Weather: Clear skies tonight, mostly because the dust clouds were eaten.", c: ca(1e20) },

    // ---------- crunchAll >= 1e25 ----------

    { t: "The home galaxy has been rebranded as The Galaxy (Lite).", c: ca(1e25) },
    { t: "Cosmologists revise the age of the universe: 'Old, but gettin' snacked.'", c: ca(1e25) },
    { t: "Ad: Spiral Arm Repair. Your galaxy lookin' chewed? We can fix that. Probably.", c: ca(1e25) },
    { t: "Report: Dark matter is dark because it's hidin' from the Sheriff.", c: ca(1e25) },
    { t: "Interstellar dust officially reclassified as 'crumbs.'", c: ca(1e25) },
    { t: "Constellation 'The Great Bear' renamed 'The Medium Bear.' Next week: 'A Hint of Bear.'", c: ca(1e25) },
    { t: "Horoscope (All signs): Your constellations have been eaten. Horoscopes suspended until further notice.", c: ca(1e25) },
    { t: "Narrator: This was supposed to be a small Western about a sheriff. Now he's eating galaxies. CUT! CUT!", c: ca(1e25) },

    { t: "Report: The speed of light has slowed down to get a better look at the Sheriff's mustache.", c: ca(1e30) },
    { t: "Ad: Spare Universes, gently used. Minor nibble marks. No refunds, partner.", c: ca(1e30) },

    { t: "Interview with the Void: '...' 'Thanks for having me.' 'Please don't, Sheriff.'", c: ca(1e30) },

    { t: "The fourth dimension has been eaten. High noon now happens 'sort of sideways.'", c: ca(1e40) },
    { t: "Report: Reality now 'mostly cardboard.' Narrator: 'It always was. Now it's also chewed.'", c: ca(1e40) },
    { t: "Ad: Reality Glue. For when your existence comes apart at the bites.", c: ca(1e40) },
    { t: "Multiverse Council passes a resolution against the Sheriff. Resolution 'tastes a bit like slate.'", c: ca(1e40) },
    { t: "Concepts disappearin'. Our reporter can no longer recall the word for the thing you put on a horse.", c: ca(1e40) },
    { t: "Horoscope: The stars are gone. Ask the crunch. Or the rock horse. He knows things.", c: ca(1e40) },
    { t: "The universe has been added to a Do Not Eat list. Sheriff Gobbo cannot read. He's a sheriff.", c: ca(1e40) },
    { t: "Weather: Forecast unavailable. Weather eaten. Also the weatherman's hat.", c: ca(1e40) },

    // ---------- crunchAll >= 1e50 ----------
    { t: "Existence issues a WANTED poster for 'one (1) small round sheriff.' Nobody dares to collect.", c: ca(1e50) },
    { t: "The Gazette is now printed on the last remaining rock. Please read quickly.", c: ca(1e50) },
    { t: "Breaking: There is nothing left to break. Except geodes. There are always geodes, partner.", c: ca(1e50) },
    { t: "Ad: Nothingness! Now available in Regular and Extra Nothing. Ask at the saloon.", c: ca(1e50) },
    { t: "Philosophers agree: 'We are all just crunch waitin' to be gobbled.' Philosophers then gobbled.", c: ca(1e50) },
    { t: "The concept of 'more' has been eaten. The Sheriff still wants it.", c: ca(1e50) },
    { t: "Final census: The universe has three rocks left. Sheriff Gobbo is lookin' at 'em. It's high noon.", c: ca(1e50) },
    { t: "Interview with the Last Rock: 'I've had a good run. A long, still, completely motionless run.'", c: ca(1e50) },
    { t: "Narrator: That's a wrap, folks. The set is gone. The studio is gone. The Sheriff is eyein' the camera.", c: ca(1e50) },

    { t: "Tumbleweeds caught inside the Rock Tumbler emerge 'polished and spiritually changed.'", c: own('tumbler', 15) },

    { t: "Crystal Saloon echo reportedly repeatin' 'more... more... more... yeehaw...'", c: own('cave') },
    { t: "Ad: The Crystal Saloon! Bring a lantern and an appetite. Please don't lick the bar.", c: own('cave', 5) },
    { t: "Brawl at the Crystal Saloon: three chairs smashed, all eaten before they hit the floor.", c: own('cave', 15) },
    { t: "Crystal Saloon stalagmites growin' faster 'out of sheer anxiety.' Bartender also anxious.", c: own('cave', 30) },

    { t: "Ad: Gremlin Posse for hire. Fast, cheap, occasionally on fire.", c: own('gremlin', 15) },

    { t: "Ad: Ride the Tectonic Rodeo! Thrills guaranteed in only 40 million years.", c: own('treadmill', 5) },
    { t: "Coastal folks wake to find they're now inland. 'At least the view is new.'", c: own('treadmill', 15) },

    { t: "Ad: Fossil Blender Saloon. Ancient flavors, modern bar stools!", c: own('fossil', 5) },

    { t: "Ad: Moon Cheese? No. Moon ROCK. Better. Crunchier. Ranch-raised.", c: own('moon', 5) },

    G.$$('#buymode button').forEach((b) => (b.onclick = () => G.UI.setBuyMode(b.dataset.m === 'max' ? 'max' : +b.dataset.m)));
    G.$$('#mobnav button').forEach((b) => (b.onclick = () => G.UI.setView(b.dataset.v)));

    document.getElementById('btn-music').onclick = () => { const s = G.state.settings; s.music = !s.music; G.Audio.init(); G.Audio.applySettings(); if (s.music) G.Audio.startMusic(); updateIcons(); };
    document.getElementById('btn-table').onclick = () => { if (G.Table.run) G.Table.show(); else G.UI.setTab('table'); };
    document.getElementById('bloom-mini').onclick = () => G.UI.setTab('bloom');
    let logoN = 0;

    const updateIcons = () => { document.getElementById('btn-sfx').textContent = G.state.settings.sfx ? '🔊' : '🔇'; document.getElementById('btn-music').textContent = G.state.settings.music ? '🎵' : '🎶'; document.getElementById('btn-music').classList.toggle('off', !G.state.settings.music); };
    updateIcons();
    // first gesture starts audio
    const unlock = () => { G.Audio.init(); if (G.state.settings.music) G.Audio.startMusic(); removeEventListener('pointerdown', unlock); };
    addEventListener('pointerdown', unlock);
    // konami
    const code = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a']; let ki = 0;
    addEventListener('keydown', (e) => { G.lastInput = Date.now(); ki = e.key === code[ki] ? ki + 1 : e.key === code[0] ? 1 : 0; if (ki === code.length) { ki = 0; G.state.secrets.konami = 1; G.FX.confetti(200); G.FX.banner('↑↑↓↓←→←→BA<small>Yee-haw-haw-haw-haw-haw</small>', { cls: 'glim' }); for (let i = 0; i < 12; i++) setTimeout(() => G.Audio.yeehaw(), i * 220); for (let i = 0; i < 6; i++) setTimeout(() => G.Events.spawnTumbleweed(), i * 300); } });
    addEventListener('pointerdown', () => (G.lastInput = Date.now()));
    G.lastInput = Date.now();

    // welcome back / first time
    const off = had ? G.applyOffline() : null;
    const daily = G.Events.checkDaily();
    const queue = [];
    if (!had) queue.push(intro);
    if (off && off.gain > 0) queue.push((n) => welcomeBack(off, n));
    if (daily && (had || daily.streak > 1)) queue.push((n) => dailySnack(daily, n));
    const nextModal = () => { const f = queue.shift(); if (f) f(nextModal); };
    nextModal();
    if (G.DEV) devPanel();

    // loops
    let last = performance.now(), acc = 0, sec = 0, saveT = 0, newsT = 0;
    const frame = (t) => {
      const dt = Math.min(1, (t - last) / 1000); last = t;
      G.earn(G.cps() * dt);
      G.state.playTime += dt;
      acc += dt; sec += dt; saveT += dt; newsT += dt;
      G.Geode.draw(t);
      G.Gobbo.tick(t);
      G.FX.step();
      if (acc > 0.1) { acc = 0; G.UI.update(); G.Geode.tick(); G.Table.tick(); }
      if (sec > 1) { sec = 0; G.dirty(); G.Events.tick(); G.Events.checkAch(); }
      if (saveT > 10) { saveT = 0; G.save(); }
      if (newsT > 9) { newsT = 0; G.Events.nextNews(); }
      requestAnimationFrame(frame);
    };
    G.Events.nextNews();
    requestAnimationFrame(frame);
    // keep earning when the tab is hidden (rAF stops): catch up on return
    let hiddenAt = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { hiddenAt = Date.now(); G.save(); }
      else if (hiddenAt) { const secs = (Date.now() - hiddenAt) / 1000; if (secs > 2) { const g = G.cps() * secs; G.earn(g); if (secs > 60) G.FX.toast(`While the tab was hidden Gobbo crunched <b>${G.fmt(g)}</b>`); } hiddenAt = 0; last = performance.now(); }
    });
    addEventListener('beforeunload', () => { if (!G.wiped) G.save(); });
  };

    if (off.gain >= 1e12) G.state.secrets.welcome = 1;
    const m = G.UI.modal(`<div class="welcome wanted"><div class="w-top">TELEGRAM</div><div class="wb-gobbo">🤠💤</div><h2>Well howdy, stranger!</h2><p>${G.pick(G.QUIPS.welcomeBack)}</p>
      <p>You were gone <b>${G.fmtTime(off.away)}</b>. While nappin' under his hat, Gobbo crunched</p><div class="wb-amt" id="wb-amt">0</div><p class="muted">${off.capped ? `Gobbo only naps for ${G.fmtTime(G.offlineCap())} at a time. ` : ''}Offline rate ${G.pct(G.offlineRate())}. The Tooth Tree can improve both.</p></div>`, { buttons: [{ label: 'Much obliged 🤠', cls: 'primary', fn: () => { G.FX.confetti(80); G.Audio.coin(); G.Audio.yeehaw(); } }], onClose: done });
    const n = m.querySelector('#wb-amt'), t0 = performance.now();
    const f = (t) => { const k = Math.min(1, (t - t0) / 1400); n.textContent = G.fmt(off.gain * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  }
  function dailySnack(d, done) {
    const days = Array.from({ length: 7 }, (_, i) => { const n = Math.floor((d.streak - 1) / 7) * 7 + i + 1; return `<div class="ds-day ${n < d.streak ? 'past' : n === d.streak ? 'now' : ''}"><small>Day ${n}</small><span>${n % 7 === 0 ? '🔮' : n === d.streak ? '🎁' : n < d.streak ? '✅' : '🍪'}</span></div>`; }).join('');
    const m = G.UI.modal(`<div class="daily wanted"><div class="w-top">CHUCKWAGON</div><h2>🫘 Daily Snack!</h2><p>Day <b>${d.streak}</b> streak${d.streak > 1 ? ' 🔥' : ''}. Come back tomorrow to keep it going!</p><div class="ds-row">${days}</div>
      <div class="ds-chest" id="ds-chest">🧰</div><p class="muted" id="ds-hint">Tap the strongbox three times!</p><div id="ds-reward" class="ds-reward"></div></div>`, { sticky: true, onClose: done });
    const chest = m.querySelector('#ds-chest');
    let taps = 0;
    chest.onclick = (e) => {
      taps++; G.Audio.init(); G.Audio.crunch(taps * 20); G.FX.shake(3 + taps * 2); chest.classList.remove('shake'); void chest.offsetWidth; chest.classList.add('shake');
      if (taps < 3) return;
      chest.textContent = '💰'; chest.onclick = null;
      G.FX.confetti(140, e.clientX, e.clientY); G.Audio.fanfare(); G.Audio.capgun(); G.Audio.yeehaw();
      m.querySelector('#ds-hint').remove();
      m.querySelector('#ds-reward').innerHTML = `<div>+<b>${G.fmt(d.crunch)}</b> crunch</div>${d.crystals ? `<div>+<b>${d.crystals}</b> Bloom Crystal${d.crystals > 1 ? 's' : ''} 🔮</div>` : ''}${d.storm ? '<div>⚡ A GLIMMER STORM approaches!</div>' : ''}<button class="btn primary" id="ds-ok">Yeehaw!</button>`;
      m.querySelector('#ds-ok').onclick = () => { m.close(); if (d.storm) setTimeout(() => G.Events.glimmerStorm(10), 600); };
    };
  }
  function devPanel() {
    G.state.secrets.dev = 1;
    const d = G.el('div', 'devpanel', `<b>DEV</b>
      <button data-a="c">+1e6 ×</button><button data-a="cc">×1000 crunch</button><button data-a="g">glimmer</button><button data-a="t">thief</button><button data-a="b">bloom ripe</button><button data-a="m">+molars</button><button data-a="$">+$50 table</button><button data-a="ach">check ach</button><button data-a="rare">rare geode</button>`);
    document.body.appendChild(d);
    d.onclick = (e) => {
      const a = e.target.dataset.a; if (!a) return;
      const s = G.state;
      if (a === 'c') G.earn(Math.max(1e6, s.crunch * 10));
      if (a === 'cc') G.earn(Math.max(1e3, s.crunch * 1000));
      if (a === 'g') G.Events.spawnGlimmer();
      if (a === 't') G.Events.spawnThief();
      if (a === 'b') s.bloom.start = 0;
      if (a === 'm') s.molars += 1000;
      if (a === '$' && G.Table.run) { G.Table.run.money += 50; G.Table.render(); }
      if (a === 'ach') G.Events.checkAch();
      if (a === 'rare') G.Geode.newGeode(G.pick(G.GEODES.slice(1)));
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
