<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dungeon Joe</title>
    <script>
      // Deep links under /DungeonJoe/ fall back to the game's entry page.
      (function () {
        var base = '/DungeonJoe/';
        var path = window.location.pathname;
        if (path.indexOf(base) === 0 && path !== base) {
          window.location.replace(base + window.location.search + window.location.hash);
        } else if (path.indexOf(base) !== 0) {
          window.location.replace(base);
        }
      })();
    </script>
  </head>
  <body style="background:#14121a;color:#efe6d2;font-family:'Segoe UI',system-ui,sans-serif">
    <p>Joe took a wrong turn. <a style="color:#e6b84a" href="/DungeonJoe/">Back to the stairs.</a></p>
  </body>
</html>
