# Builds the game and publishes it to GitHub Pages on every push to main.
# This repo is named "games", so its Pages site is josephjackman.com/games/ (the account's user site
# has the josephjackman.com custom domain). The game is published in the dungeonjoe/ folder of that
# site, so it lives at josephjackman.com/games/dungeonjoe/ (D48). deploy/index.html is the /games/ hub.
# The other games (deploy/library.json) are added beside it by deploy/assemble.mjs, each from its own
# repo's `ready` branch. library-watch.yml starts this workflow when one of them has a new version.
# One-time owner step: repo Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # the full history: the game version counts commits (vite.config.ts)
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # the generated balance report on the run's summary page; it can never fail or stall a deploy
      - name: Balance report
        continue-on-error: true
        timeout-minutes: 5
        run: |
          npm run balance:report
          cat docs/balance/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble the /games/ site
        run: |
          mkdir -p site/dungeonjoe
          cp -r dist/. site/dungeonjoe/
          cp deploy/index.html site/index.html
          cp deploy/404.html site/404.html
          touch site/.nojekyll
      - name: Add the other games
        run: node deploy/assemble.mjs build site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
